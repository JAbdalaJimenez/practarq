<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulacro Arquitectura 2do Parcial Completo</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --incorrect: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header {
            background-color: var(--surface); padding: 16px; text-align: center;
            border-bottom: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 10;
        }
        h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .progress-container { width: 100%; background-color: var(--bg); height: 6px; margin-top: 12px; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s; }
        .stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
        
        main { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .quiz-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 80px; }
        
        .question-card { background-color: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin: 0 0 20px 0; color: #ffffff; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background-color: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 16px; border-radius: 10px; font-size: 0.95rem; text-align: left;
            cursor: pointer; transition: all 0.2s; line-height: 1.4;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.disabled { pointer-events: none; opacity: 0.8; }
        .option-btn.correct { background-color: rgba(16, 185, 129, 0.2); border-color: var(--correct); color: var(--correct); font-weight: 600; }
        .option-btn.incorrect { background-color: rgba(239, 68, 68, 0.2); border-color: var(--incorrect); color: var(--incorrect); }
        
        /* NUEVOS ESTILOS PARA EL CARTEL DE RESPUESTA */
        .feedback-text {
            margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: 700;
            text-align: center; font-size: 1rem; display: none;
        }
        .feedback-correct { color: var(--correct); background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--correct); }
        .feedback-incorrect { color: var(--incorrect); background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--incorrect); }

        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--surface);
            padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: center;
        }
        .next-btn {
            background-color: var(--primary); color: white; border: none; padding: 16px 32px;
            border-radius: 10px; font-size: 1rem; font-weight: 700; width: 100%; max-width: 500px;
            cursor: pointer; display: none; text-transform: uppercase; letter-spacing: 1px;
        }
        .next-btn:active { background-color: var(--primary-dark); }
        
        .result-screen { display: none; text-align: center; margin-top: 40px; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--surface); border: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; margin: 0 auto 20px auto; color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <h1>Simulacro 2do Parcial</h1>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <div class="stats">
            <span id="counterText">1 / 76</span>
            <span id="scoreText">Puntos: 0</span>
        </div>
    </header>

    <main>
        <div class="quiz-container" id="quizContainer">
            <div class="question-card">
                <p class="question-text" id="questionText">Cargando pregunta...</p>
                <div class="options" id="optionsContainer"></div>
                <!-- CONTENEDOR DEL TEXTO CORRECTO/INCORRECTO -->
                <div id="feedbackText" class="feedback-text"></div>
            </div>
        </div>
        
        <div class="result-screen" id="resultScreen">
            <div class="score-circle" id="finalScore">0%</div>
            <h2 style="color: white; margin-bottom: 8px;">¡Simulacro Completado!</h2>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Has finalizado todas las preguntas del parcial.</p>
            <button class="next-btn" style="display: block;" onclick="location.reload()">Reiniciar Simulacro</button>
        </div>
    </main>

    <div class="bottom-bar" id="bottomBar" style="display: none;">
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Siguiente Pregunta</button>
    </div>

    <script>

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        shuffleArray(db); 
        
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        const qText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("optionsContainer");
        const nextBtn = document.getElementById("nextBtn");
        const bottomBar = document.getElementById("bottomBar");
        const counterText = document.getElementById("counterText");
        const scoreText = document.getElementById("scoreText");
        const progressBar = document.getElementById("progressBar");

        function loadQuestion() {
            if(currentIndex >= db.length) {
                showResults();
                return;
            }
            answered = false;
            bottomBar.style.display = "none";
            const currentQ = db[currentIndex];
            qText.innerText = currentQ.q;
            counterText.innerText = `${currentIndex + 1} / ${db.length}`;
            progressBar.style.width = `${((currentIndex + 1) / db.length) * 100}%`;
            
            let options = [
                { text: currentQ.a, isCorrect: true },
                { text: currentQ.f[0], isCorrect: false },
                { text: currentQ.f[1], isCorrect: false },
                { text: currentQ.f[2], isCorrect: false }
            ];
            shuffleArray(options);

            optionsContainer.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(btn, opt.isCorrect, options);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, isCorrect, allOptions) {
            if(answered) return;
            answered = true;
            const buttons = optionsContainer.children;
            for(let i=0; i<buttons.length; i++) {
                buttons[i].classList.add("disabled");
                if(allOptions[i].isCorrect) {
                    buttons[i].classList.add("correct");
                }
            }
            if(isCorrect) {
                score++;
                scoreText.innerText = `Puntos: ${score}`;
            } else {
                selectedBtn.classList.add("incorrect");
            }
            bottomBar.style.display = "flex";
            if(currentIndex === db.length - 1) {
                nextBtn.innerText = "Ver Resultados Finales";
            } else {
                nextBtn.innerText = "Siguiente Pregunta";
            }
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
            document.getElementById('quizContainer').scrollIntoView({behavior: "smooth"});
        }

        function showResults() {
            document.getElementById("quizContainer").style.display = "none";
            document.getElementById("bottomBar").style.display = "none";
            const rs = document.getElementById("resultScreen");
            rs.style.display = "block";
            const percentage = Math.round((score / db.length) * 100);
            const circle = document.getElementById("finalScore");
            circle.innerText = `${percentage}%`;
            if(percentage >= 60) {
                circle.style.borderColor = "var(--correct)";
                circle.style.color = "var(--correct)";
            } else {
                circle.style.borderColor = "var(--incorrect)";
                circle.style.color = "var(--incorrect)";
            }
        }

        loadQuestion();
    </script>
